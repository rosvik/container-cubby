name: Push Container To Registry
on:
  push:
    branches:
      - main
      - rosvik/cargo-chef

jobs:
  podman-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get potential cache
        uses: actions/cache@v4
        with:
          path: /tmp/build-cache
          key: ${{ runner.os }}-build-cache-${{ hashFiles('Cargo.lock') }}

      # Setup for multi architecture build
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Build Image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: container-cubby
          tags: latest ${{ github.sha }}
          platforms: linux/amd64
          oci: true
          layers: true
          containerfiles: |
            Containerfile
          build-args: |
            cache-to=type=local,dest=/tmp/build-cache
            cache-from=type=local,src=/tmp/build-cache
      - name: Push To cubby.no
        id: push-to-cubby
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: cubby.no/rosvik
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Print image url
        run: echo "Image pushed to ${{ steps.push-to-cubby.outputs.registry-paths }}"
