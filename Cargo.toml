[package]
name = "container-cubby"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.11.0"
anyhow = "1.0.98"
base64 = "0.22.1"
dotenv = "0.15.0"
futures-util = "0.3.31"
regex-lite = "0.1.6"
serde = {version = "1.0.219", features = ["derive"]}
serde_json = "1.0.140"
serde_with = "3.14.0"
serde_qs = {version = "1.1.1", features = ["actix4"]}
sha2 = "0.10.2"
tokio = {version = "1.46.1", features = ["rt-multi-thread"]}
tower = "0.5.2"
uuid = {version = "1.17.0", features = ["v4"]}
xattr = {version = "1.5.1", features = []}
tokio-cron-scheduler = "0.10.2"
chrono = "0.4.41"

[dev-dependencies]
fastrand = "2.3.0"
tempfile = "3.20.0"
